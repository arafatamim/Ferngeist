config:
  validation: true
  warningsAsErrors: false

naming:
  FunctionNaming:
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
    # Compose functions are PascalCase by convention (e.g. FooButton); detekt's
    # FunctionNaming otherwise flags every @Composable as a violation.
    ignoreAnnotated: ['Composable']
  FunctionParameterNaming:
    # Allow the Kotlin `_` prefix for intentionally-unused parameters.
    parameterPattern: '[a-z_][A-Za-z0-9_]*'

style:
  MaxLineLength:
    active: false
  MagicNumber:
    # Compose layout/color literals (dp, Color) are idiomatic as inline values.
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  ReturnCount:
    max: 4
  UnusedParameter:
    # Kotlin convention: `_`-prefixed params are intentionally unused.
    allowedNames: 'ignored|expected|_.*'

complexity:
  LongMethod:
    # Compose UI functions are long by structure (parameter lists + UI trees),
    # same rationale as FunctionNaming above; LongMethod still guards
    # ViewModels, reducers, and other logic-bearing functions.
    ignoreAnnotated: ['Composable']
  # Thresholds are the house limit, not a survey of current code. Anything already
  # over it is listed in the per-module detekt-baseline.xml files; raising a number
  # here instead of splitting the type is how a 1300-line file becomes acceptable.
  TooManyFunctions:
    allowedFunctionsPerClass: 15
    allowedFunctionsPerInterface: 15
    allowedFunctionsPerObject: 15
    allowedFunctionsPerFile: 15
  LargeClass:
    allowedLines: 600
  NestedBlockDepth:
    allowedDepth: 3
  CognitiveComplexMethod:
    active: true
    allowedComplexity: 15
  ComplexInterface:
    active: true
    allowedDefinitions: 12
    includePrivateDeclarations: false
  StringLiteralDuplication:
    active: true
    allowedDuplications: 3
    allowedWithLengthLessThan: 5
