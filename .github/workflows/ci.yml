name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # The app version comes from `git describe --tags` at configuration
          # time, so a shallow checkout has no tags and the build fails.
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Compile foss debug Kotlin
        run: ./gradlew :app:compileFossDebugKotlin

      - name: Compile google debug Kotlin
        run: ./gradlew :app:compileGoogleDebugKotlin

      - name: Run foss + google unit tests
        run: ./gradlew :app:testFossDebugUnitTest :app:testGoogleDebugUnitTest

      - name: Run detekt + ktlint + lint (foss + google)
        run: ./gradlew detekt ktlintCheck :app:lintFossDebug :app:lintGoogleDebug
