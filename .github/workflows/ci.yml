name: CI

on:
  push:
    branches:
      - master
    # Docs-only changes are covered by docs.yml; they do not need a full build.
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

# A new push to the same pull request makes the previous run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      # Compiles both flavours as a side effect; the separate compile steps were redundant.
      - name: Run foss + google unit tests
        run: ./gradlew :app:testFossDebugUnitTest :app:testGoogleDebugUnitTest

      - name: Run detekt + ktlint
        run: ./gradlew detekt ktlintCheck

      - name: Run Konsist architecture tests
        run: ./gradlew :konsist:test

  # Android lint is ~6 minutes per variant and dominates the run, so each flavour gets its
  # own job and they overlap instead of queueing behind the build.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flavour: [Foss, Google]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Run lint (${{ matrix.flavour }})
        run: ./gradlew :app:lint${{ matrix.flavour }}Debug
