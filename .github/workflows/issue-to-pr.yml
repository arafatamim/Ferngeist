name: Issue to PR

# Assign an issue to yourself and a mini-SWE-agent turn implements it, then opens a draft PR.
# The workflow is the agent; the assignee only has to be someone you trust to spend credits.
on:
  issues:
    types: [assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    # Assignment is open to triage-level users, so gate the paid, write-scoped run on a person.
    if: github.event.sender.login == 'arafatamim'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The repository ruleset requires verified signatures on every branch, the agent's included.
      - name: Configure commit signing
        env:
          AGENT_SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP"
          printf '%s\n' "$AGENT_SIGNING_KEY" > "$RUNNER_TEMP/signing-key"
          chmod 600 "$RUNNER_TEMP/signing-key"
          # Fail in seconds, not at commit time after the agent has already spent its whole run.
          if ! ssh-keygen -y -f "$RUNNER_TEMP/signing-key" </dev/null >/dev/null 2>&1; then
            echo "AGENT_SIGNING_KEY is not a readable private key; refusing to start." >&2
            exit 1
          fi
          git config gpg.format ssh
          git config user.signingkey "$RUNNER_TEMP/signing-key"
          # From the repo config, so commits the agent makes itself are signed too.
          git config commit.gpgsign true
          git config user.name "Tamim Arafat"
          git config user.email "31634638+arafatamim@users.noreply.github.com"

      - name: Set up uv
        # setup-uv stopped publishing floating major tags after v7, so v10.3.3 is the newest
        # that resolves; pinning the exact tag is also the safer reference.
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install mini-SWE-agent
        run: |
          mkdir -p "$RUNNER_TEMP"
          # A venv, not --system: the install stays off the runner's Python and needs no PEP 668 escape.
          uv venv "$RUNNER_TEMP/venv"
          # litellm imports `mcp` whenever tools are passed, and mini's dependency set omits it.
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" "mini-swe-agent>=2,<3" mcp
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Write the agent config and the task
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SESSION_ID: ${{ github.run_id }}
          MODEL: ${{ vars.MINI_MODEL || 'deepseek-v4.1-flash' }}
        run: |
          # The hosted runner pre-creates RUNNER_TEMP; local runners may not.
          mkdir -p "$RUNNER_TEMP"
          # OpenCode Go asks non-OpenCode clients to send their own UA and a stable session id.
          # -c replaces the packaged config, so this file is merged on top of mini.yaml below.
          cat > "$RUNNER_TEMP/overrides.yaml" <<YAML
          model:
            # litellm has no price entry for these ids, and mini hard-fails without this.
            cost_tracking: ignore_errors
            model_name: openai/${MODEL}
            model_kwargs:
              api_base: https://opencode.ai/inference/go/openai/v1
              extra_headers:
                User-Agent: mini-swe-agent/2
                x-opencode-session: "${SESSION_ID}"  # quote: run_id is numeric and YAML would type it
          agent:
            mode: yolo
            confirm_exit: false
            cost_limit: 0
            step_limit: 120
            wall_time_limit_seconds: 2400
          environment:
            timeout: 900
          YAML

          {
            echo "Read AGENTS.md and follow it."
            echo
            echo "Implement GitHub issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
            echo
            printf '%s\n' "$ISSUE_BODY"
            echo
            echo "Constraints:"
            echo "- Leave the changes uncommitted; the workflow commits and opens the PR."
            echo "- Do not modify .github/workflows, local.properties, or signing material."
            echo
            # PR #30 split bubbles correctly in acp-bridge and broke feature/chat, which it never read.
            echo "Before editing, map the blast radius. This is part of doing the task correctly:"
            echo "- Find every consumer of the types, events and state you will change, in every module,"
            echo "  including feature/* UI, not only the module you edit."
            echo "- For each consumer, note the assumption it makes (e.g. one assistant bubble per turn)"
            echo "  and whether your change breaks it. Fix what breaks, within the issue's scope."
            echo "- Treat the issue's \"Expected UI result\" section as the acceptance target. If it has none"
            echo "  and the change is user-visible, state what the user will now see."
            echo "- Write the consumer list, the assumptions, and the expected UI result to"
            echo "  .git/agent-pr-notes.md as Markdown. The workflow puts it in the PR body."
            echo
            echo "Builds are the slow part, so build as little as possible:"
            echo "- While editing, check your work with ./gradlew -q :<module>:compileDebugKotlin, where"
            echo "  <module> is the Gradle path of a module you changed (e.g. :feature:chat)."
            echo "- Never run ./gradlew build, any assemble* or lint* task, or any :app: task."
            echo "  CI compiles both flavours, runs lint and Konsist on the pull request; do not repeat it."
            echo "- When you believe you are done, run this gate once and fix whatever it reports:"
            echo "    timeout 900 ./gradlew :<module>:detekt :<module>:ktlintCheck :<module>:testDebugUnitTest"
            echo "  Repeat the :<module> prefix for every module you changed. Never call detekt or"
            echo "  ktlint without a module prefix: that analyses the whole repository."
          } > "$RUNNER_TEMP/task.md"

      - name: Run mini-SWE-agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # Without this, mini runs its interactive first-run setup and aborts on a non-tty runner.
          MSWEA_CONFIGURED: "1"
        run: |
          chmod +x ./gradlew
          # Branch first: the agent may commit on its own, and either way the work must land here.
          git switch -c "agent/issue-${ISSUE_NUMBER}"
          git rev-parse HEAD > "$(git rev-parse --git-dir)/agent-base-sha"
          mini \
            -c mini.yaml \
            -c "$RUNNER_TEMP/overrides.yaml" \
            -t "$(cat "$RUNNER_TEMP/task.md")" \
            -y --exit-immediately

      - name: Open a draft pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          BASE_SHA=$(cat "$(git rev-parse --git-dir)/agent-base-sha")
          # Compares the whole tree against the branch point, so agent-made commits count too.
          if git diff --quiet "$BASE_SHA"; then
            gh issue comment "$ISSUE_NUMBER" --body "mini-SWE-agent produced no changes."
            exit 0
          fi

          git add -A
          # Signed through commit.gpgsign; identity was set with the signing key above.
          git diff --cached --quiet || git commit -m "fix: implement #${ISSUE_NUMBER}"
          git push --set-upstream origin "agent/issue-${ISSUE_NUMBER}"

          NOTES="$(git rev-parse --git-dir)/agent-pr-notes.md"
          {
            echo "Closes #${ISSUE_NUMBER}"
            echo
            echo "Automated by mini-SWE-agent. Review before marking ready."
            echo
            if [ -s "$NOTES" ]; then
              cat "$NOTES"
            else
              echo "**The agent wrote no consumer list; check the blast radius by hand.**"
            fi
          } > "$RUNNER_TEMP/pr-body.md"

          gh pr create --draft \
            --base master \
            --title "fix: ${ISSUE_TITLE}" \
            --body-file "$RUNNER_TEMP/pr-body.md"
