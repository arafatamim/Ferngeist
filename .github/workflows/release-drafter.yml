name: Create Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: -l
        env:
          OUTPUT: CHANGES.md

      - name: Update CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: -l --prepend CHANGELOG.md

      - name: Commit and push changes
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Only a tag already on master may advance it; a tag cut from a feature branch
          # leaves CHANGES.md to that branch's release instead of merging the branch here.
          git fetch --quiet origin master
          if git merge-base --is-ancestor HEAD origin/master; then on_master=1; else on_master=0; fi
          git add CHANGELOG.md
          git commit -m "chore: update CHANGELOG.md for ${{ github.ref_name }}"
          if [ "$on_master" = 1 ]; then
            git push origin HEAD:master
          else
            echo "Tag is not on master; master left untouched."
          fi

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file CHANGES.md \
            --draft
